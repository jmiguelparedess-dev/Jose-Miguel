  .bars .r{grid-template-columns:96px 1fr 28px}.comp{grid-template-columns:1fr 50px}.comp .trk{grid-column:1/-1}.fields td:first-child{width:auto}.mast img{height:38px}.nav a{padding:6px 8px;font-size:12px}}
</style>

<script>
"use strict";
/* ============================================================ constantes */
const FC = "Firecrawl";
const OBJ = "Prospección comercial de un estudio jurídico boliviano: identificar empresas constructoras, inmobiliarias y de infraestructura en Bolivia con datos públicos verificables.";
const SECTORS = ["Construcción","Desarrollo inmobiliario","Promoción inmobiliaria","Infraestructura"];
const CRM = ["Nuevo prospecto","Investigado","Pendiente de contacto","Contactado","Reunión solicitada","Reunión confirmada","Reunión realizada","Negociación","Cliente","Descartado"];
const KINDS = ["Comentario","Llamada","Correo enviado","Mensaje LinkedIn","Reunión","Propuesta enviada","Tarea de seguimiento"];
const CF = {name:"Nombre de la empresa",legal_name:"Razón social",activity:"Actividad",sector:"Sector",city:"Ciudad",department:"Departamento",website:"Página web",email:"Correo corporativo",phone:"Teléfono corporativo",linkedin_url:"LinkedIn de la empresa",description:"Descripción"};
const KEYF = ["activity","sector","city","website","email","phone","linkedin_url"];
const EF = {full_name:"Nombre",position:"Cargo",email:"Correo profesional",phone:"Teléfono",linkedin_url:"LinkedIn del ejecutivo"};

const CITY_DEPT = {"Santa Cruz de la Sierra":"Santa Cruz","Montero":"Santa Cruz","Warnes":"Santa Cruz","Cotoca":"Santa Cruz","Porongo":"Santa Cruz","La Guardia":"Santa Cruz","Camiri":"Santa Cruz","Puerto Suárez":"Santa Cruz","La Paz":"La Paz","El Alto":"La Paz","Viacha":"La Paz","Cochabamba":"Cochabamba","Quillacollo":"Cochabamba","Sacaba":"Cochabamba","Tiquipaya":"Cochabamba","Colcapirhua":"Cochabamba","Sucre":"Chuquisaca","Tarija":"Tarija","Yacuiba":"Tarija","Bermejo":"Tarija","Oruro":"Oruro","Potosí":"Potosí","Uyuni":"Potosí","Trinidad":"Beni","Riberalta":"Beni","Cobija":"Pando"};
const CITY_ALIAS = {"santa cruz de la sierra":"Santa Cruz de la Sierra","santa cruz":"Santa Cruz de la Sierra","la paz":"La Paz","el alto":"El Alto","cochabamba":"Cochabamba","cbba":"Cochabamba"};
const PRIO = ["Santa Cruz","La Paz","Cochabamba"];
const DEPTS = ["Santa Cruz","La Paz","Cochabamba","Chuquisaca","Tarija","Oruro","Potosí","Beni","Pando"];
const SECTOR_KW = {
  "Infraestructura":["infraestructura","carretera","puente","vial","obras públicas","obra pública","saneamiento","alcantarillado","hidroeléctrica","represa","aeropuerto","pavimento","asfalt","movimiento de tierras"],
  "Promoción inmobiliaria":["promotora","promoción inmobiliaria","preventa","comercializa","venta de departamentos","bienes raíces","corredor inmobiliario"],
  "Desarrollo inmobiliario":["desarrolladora","desarrollo inmobiliario","desarrollos inmobiliarios","inmobiliaria","condominio","urbanización","loteamiento","edificio","torre","departamentos","barrio cerrado","residencial"],
  "Construcción":["constructora","construcción","construcciones","obras civiles","ingeniería civil","contratista","edificaciones","remodelación"]};
const GENERIC = new Set("constructora construcciones construccion inmobiliaria desarrolladora desarrollos grupo empresa compania cia ingenieria bolivia y de del la el los las and asociados proyectos inversiones promotora urbanizadora consorcio srl sa ltda".split(" "));
const EXCL = ["facebook.com","instagram.com","linkedin.com","twitter.com","x.com","youtube.com","tiktok.com","wikipedia.org","google.com","bing.com","gob.bo","mercadolibre.com","olx.com.bo","ultracasas.com","infocasas.com.bo","properati.com","paginasamarillas.com.bo","cylex.com.bo","empresite.com","dnb.com","bnamericas.com","emis.com","glassdoor.com","indeed.com","computrabajo.com","whatsapp.com","wa.me","blogspot.com","wordpress.com","medium.com","scribd.com","issuu.com","pinterest.com","tripadvisor.com","linktr.ee","wixsite.com","yumpu.com"];

/* ============================================================ utilidades */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowIso = () => new Date().toISOString().slice(0,19)+"Z";
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const clean = s => String(s ?? "").replace(/\s+/g," ").trim();
const strip = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"");
const clone = o => JSON.parse(JSON.stringify(o));
function fdate(v, time){ if(!v) return "—"; const d=new Date(v); if(isNaN(d)) return esc(v); const p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`+(time&&String(v).includes("T")?` ${p(d.getHours())}:${p(d.getMinutes())}`:""); }
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function ldate(v){ if(!v) return "fecha no indicada"; const d=new Date(v); return isNaN(d)?v:`${d.getUTCDate()} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`; }
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return (h>>>0).toString(36); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true, 3800); }

/* ============================================================ calidad */
const LEGAL = /(?<![a-z])(sociedad de responsabilidad limitada|sociedad anonima mixta|sociedad anonima|s\.?\s?r\.?\s?l\.?|s\.?\s?a\.?\s?m\.?|s\.?\s?a\.?|ltda\.?|limitada|e\.?\s?i\.?\s?r\.?\s?l\.?|unipersonal)(?![a-z])/g;
function nameKey(n){ return clean(strip(String(n||"").toLowerCase()).replace(/&/g," y ").replace(LEGAL," ").replace(/[^a-z0-9 ]/g," ")); }
function coreKey(n){ return nameKey(n).split(" ").filter(t=>t && !GENERIC.has(t)).join(" "); }
function domainOf(u){ if(!u) return null; let s=String(u).trim(); if(!/^https?:\/\//i.test(s)) s="http://"+s; try{ let h=new URL(s).hostname.toLowerCase(); return h.replace(/^www\./,"")||null; }catch(e){ return null; } }
const dm = (d, list) => !!d && list.some(x => d===x || d.endsWith("."+x));
const isExcl = d => dm(d, EXCL), isNews = d => dm(d, NEWSD);
function normPhone(raw){ let d=String(raw||"").replace(/\D/g,""); if(d.startsWith("00591")) d=d.slice(5); else if(d.startsWith("591") && d.length>9) d=d.slice(3); return (d.length===7||d.length===8)?"+591 "+d:null; }
function vkey(f,v){ v=clean(v); if(f==="email") return v.toLowerCase(); if(f==="website"||f==="linkedin_url") return v.toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""); if(f==="phone") return v.replace(/\D/g,"").slice(-8); return strip(v.toLowerCase()); }
function similar(a,b){ if(!a||!b) return 0; if(a===b) return 1; const bg=s=>{const m=new Map(); for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2); m.set(g,(m.get(g)||0)+1);} return m;}; const A=bg(a),B=bg(b); let n=0; for(const [g,c] of A) n+=Math.min(c,B.get(g)||0); return 2*n/((a.length-1)+(b.length-1)||1); }
function detectCity(text){ if(!text) return [null,null]; const t=strip(String(text).toLowerCase()); let best=null;
  const test=(k,city)=>{ const m=new RegExp("(?<![a-z])"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![a-z])").exec(t); if(m && (!best||m.index<best[0])) best=[m.index,city]; };

function needsRisks(c,cats){ const s=c.sector||"", pr=c.projects||[], needs=[], risks=[]; const fp=pr[0]; const pt=pr.map(x=>((x.type||"")+" "+x.name).toLowerCase()).join(" ");

function mcpMsg(e){ const c=e&&e.code; return ({server_not_connected:"Firecrawl no está conectado. Agréguelo en claude.ai → Configuración → Conectores.",needs_reauth:"La conexión con Firecrawl venció. Vuelva a conectarlo en claude.ai → Configuración → Conectores.",not_in_manifest:"Esta página no tiene permiso para usar Firecrawl. Permítalo desde el menú Permisos del artefacto.",approval_required:"Firecrawl necesita su aprobación: vuelva a pulsar el botón y acepte el aviso.",blocked_by_policy:"La política de su organización bloquea Firecrawl.",selection_required:"Tiene más de un conector Firecrawl: elija uno en el aviso de claude.ai.",server_unavailable:"Firecrawl no respondió. Intente de nuevo en unos minutos.",tool_error:"Firecrawl informó un error: "+(e&&e.message||"").slice(0,180)})[c]||("Error al consultar Firecrawl ("+(c||"desconocido")+")."); }

const nq = s => clean(strip(String(s||"").toLowerCase()).replace(/[“”«»"']/g,""));
/* Claude como lector: cada dato debe traer una cita textual que exista en la fuente; si no, se descarta. */
async function claudeExtract(ctx, company, sources){ if(!S.sample || S.meta.useClaude===false) return null; const blocks=sources.map((s,i)=>`[${i+1}] ${s.url}\n${s.text.slice(0,9000)}`).join("\n\n---\n\n");
  const prompt=`Eres analista de inteligencia comercial de un estudio jurídico boliviano. Lee SOLO las fuentes numeradas sobre la empresa «${company}» y devuelve datos que estén escritos literalmente en ellas. No deduzcas ni completes nada; nunca construyas correos por formato.\nResponde sólo JSON: {"fields":[{"field":"activity|sector|city|phone|email|linkedin_url|website|legal_name|description","value":"...","source":1,"quote":"cita textual exacta que contiene el valor"}],"executives":[{"full_name":"...","position":"...","email":null,"source":1,"quote":"cita textual exacta"}],"projects":[{"name":"...","type":"...","city":null,"source":1,"quote":"cita textual exacta"}]}\n"sector" debe ser uno de: ${SECTORS.join(", ")}. Si no hay datos, devuelve listas vacías.\n\nFUENTES:\n${blocks}`;
  ctx.log("Claude revisa las fuentes leídas…");
  let data; try{ data=await S.sample.json(prompt,{modelTier:"default"}); }catch(e){ ctx.log("  ✗ Claude no disponible ("+(e&&e.code||"error")+"); se usan sólo las reglas."); return null; }
  const ok=(it,val,loose)=>{ const s=sources[(+it.source||0)-1]; if(!s||!it.quote) return null; const q=nq(it.quote), t=nq(s.text); if(q.length<6||!t.includes(q)) return null; if(!loose && val && !q.includes(nq(val)) && !(it.field==="phone"&&String(val).replace(/\D/g,"").slice(-7)&&s.text.replace(/\D/g,"").includes(String(val).replace(/\D/g,"").slice(-7)))) return null; return s; };
  const out={fields:[],executives:[],projects:[],discarded:0};
  for(const f of (data&&data.fields)||[]){ if(!f||!CF[f.field]||f.field==="name"||!f.value){ out.discarded++; continue; } const loose=["sector","activity","description"].includes(f.field); const s=ok(f,f.value,loose); if(!s){out.discarded++;continue;} if(f.field==="sector"&&!SECTORS.includes(f.value)){out.discarded++;continue;} out.fields.push({...f,src:s}); }
  for(const e of (data&&data.executives)||[]){ const s=e&&e.full_name&&ok(e,e.full_name); if(!s||!validName(e.full_name.replace(/^(Ing|Arq|Lic|Dr|Dra)\.?\s+/,""))){out.discarded++;continue;} out.executives.push({...e,src:s}); }
  for(const p of (data&&data.projects)||[]){ const s=p&&p.name&&ok(p,p.name); if(!s){out.discarded++;continue;} out.projects.push({...p,src:s}); }
  ctx.log(`  → Claude: ${out.fields.length} datos, ${out.executives.length} ejecutivos, ${out.projects.length} proyectos confirmados con cita; ${out.discarded} descartados por no aparecer textualmente.`); return out; }

function nameFromTitle(t){ const parts=String(t||"").split(/\s+[|\-–—:·]\s+/).map(x=>x.trim()).filter(x=>x&&!/^(inicio|home|bienvenidos?|p[aá]gina principal)$/i.test(x)); if(!parts.length) return null; for(const p of parts) if(classifySector(p)||/\b(S\.?R\.?L|S\.?A|Ltda)\b/.test(p)) return p.length<=70?p:null; return parts[0].length<=50?parts[0]:null; }

async function discover(cities, sectors, extra, investigateN){ const ctx=startJob(`Buscando empresas en ${cities.join(", ")}`); if(!ctx) return; const newIds=[];
  try{ const snippets=[]; const origin="descubrimiento automático";
    const add=(name, website, src, text)=>{ name=clean(name); if(!name||coreKey(name).length<3) return null; const dup=findDup(name,website); if(dup){ ctx.stats.duplicados++; return dup.id; }
      const c=newCompany(name); const sid=addSource(c,src); recordFact(c,"company",null,"name",name,P,sid,origin,src.snippet,ctx.run); if(website) recordFact(c,"company",null,"website",website,P,sid,origin,src.snippet,ctx.run);
      const [city,dept]=detectCity(text); if(city){ recordFact(c,"company",null,"city",city,P,sid,origin,text,ctx.run); recordFact(c,"company",null,"department",dept,P,sid,origin,"Derivado de la ciudad",ctx.run); }
      const sec=classifySector(text); if(sec) recordFact(c,"company",null,"sector",sec,P,sid,origin,"Clasificado por palabras clave de la fuente",ctx.run);
      reanalyze(c); save(c); newIds.push(c.id); ctx.stats.empresas_nuevas++; ctx.log(`  + Nueva empresa: ${name}`+(website?` (${domainOf(website)})`:"")); return c.id; };
    const queries=[]; for(const city of cities) for(const s of sectors) queries.push(DISC_Q[s].replace("{city}",city)); if(extra) queries.push(extra);
    for(const q of queries){ const r=await fcSearch(ctx,q,["web","news"],10);
      for(const x of r.web){ const d=domainOf(x.url), text=`${x.title}. ${x.description||""}`; if(!d) continue; snippets.push({url:x.url,text,type:"buscador"});
        if(isExcl(d)||isNews(d)){ if(boliviaIn(text,d)) for(const n of extractCompanyNames(text)) add(n,null,{url:x.url,title:x.title,type:"buscador",snippet:x.description},text); continue; }
        if(!classifySector(text)||!boliviaIn(text,d)) continue; const name=nameFromTitle(x.title); if(name) add(name,"https://"+d,{url:x.url,title:x.title,type:"buscador",snippet:x.description},text); }
      for(const n of r.news){ const text=`${n.title}. ${n.snippet||""}`; snippets.push({url:n.url,text,type:"noticia",news:n});
        for(const nm of extractCompanyNames(text)){ const id=add(nm,null,{url:n.url,title:n.title,type:"noticia",publisher:domainOf(n.url),snippet:n.snippet},text); if(id) attachNews(id,n,text); } } }
    if(S.sample && S.meta.useClaude!==false && snippets.length){ ctx.log("Claude identifica empresas nombradas en los resultados…");
      const list=snippets.slice(0,60).map((s,i)=>`[${i+1}] ${s.text}`).join("\n");
      try{ const res=await S.sample.json(`De estos resultados de búsqueda sobre Bolivia, lista las empresas de construcción, desarrollo o promoción inmobiliaria o infraestructura que aparecen NOMBRADAS EXPLÍCITAMENTE. Copia el nombre tal cual figura. No agregues empresas que no estén escritas.\nResponde sólo JSON: [{"name":"...","source":1}]\n\n${list}`,{modelTier:"quick"});
        let disc=0; for(const it of Array.isArray(res)?res:[]){ const s=snippets[(+it.source||0)-1]; if(!s||!it.name||!nq(s.text).includes(nq(it.name))){ disc++; continue; } const id=add(it.name,null,{url:s.url,title:s.text.slice(0,120),type:s.type,snippet:s.text},s.text); if(id&&s.news) attachNews(id,s.news,s.text); }
        ctx.stats.descartados+=disc; }catch(e){ ctx.log("  Claude no disponible; se usaron sólo las reglas."); } }
    const toInv=newIds.slice(0,investigateN||0); for(const id of toInv){ try{ await investigate(id,false,ctx); }catch(e){ if(FATAL.has(e&&e.code)) throw e; ctx.log("  ✗ "+(e.message||mcpMsg(e))); } }
    endJob(ctx); }
  catch(e){ endJob(ctx,e); } }
function attachNews(id, n, text){ const c=getC(id); if(!c) return; const sid=addSource(c,{url:n.url,title:n.title,type:"noticia",publisher:domainOf(n.url),snippet:n.snippet}); addNews(c,{title:n.title,url:n.url,publisher:domainOf(n.url),date:newsDate(n.date),summary:n.snippet||null,cats:classifyNews(text),src:sid}); for(const pj of extractProjects(n.title)){ const [city]=detectCity(text); addProject(c,{...pj,city,description:n.title,conf:P,src:sid,date:newsDate(n.date)}); } reanalyze(c); save(c); }

function mapHeader(h){ const n=clean(strip(String(h||"").toLowerCase()).replace(/[^a-z0-9 ]/g," ")); if(!n||n.includes("confianza")||n.includes("fuente")||n==="id") return ""; for(const [f,s] of Object.entries(SYN)) if(s.includes(n)) return f;

function readTable(rowsBySheet){ const sheets=[]; for(const [title,rows] of rowsBySheet){ let hi=-1; for(let i=0;i<Math.min(15,rows.length);i++){ const m=rows[i].map(mapHeader); if(m.filter(Boolean).length>=2&&m.includes("name")){hi=i;break;} } if(hi<0) continue;

  if(f==="sector") return SECTORS.find(s=>strip(s.toLowerCase())===strip(v.toLowerCase()))||classifySector(v); if(f==="city"){ const [c]=detectCity(v); return c||titleCase(v); } return v; }

function proposalsFromText(text){ if(!text) return []; const props=[]; const ex=extractExecutives(text); const personal=new Set();

  for(const u of lp){ const o=ex.find(m=>strip(m.name.toLowerCase()).split(" ").slice(0,2).every(s=>u.toLowerCase().includes(s))); if(o) props.push({t:"exec",f:"linkedin_url",v:u,exec:o.name,label:`LinkedIn de ${o.name}`,ev:line(u)}); }
  for(const m of text.matchAll(/\b((?:https?:\/\/)?www\.[a-z0-9\-]+(?:\.[a-z0-9\-]+)+|https?:\/\/[a-z0-9\-]+(?:\.[a-z0-9\-]+)+)/gi)){ const d=domainOf(m[1]); if(d&&!isExcl(d)){ props.push({t:"company",f:"website",v:"https://"+d,label:"Página web",ev:line(m[1])}); break; } }
  for(const p of extractProjects(text).slice(0,15)) props.push({t:"project",f:"project",v:p.name,ptype:p.type,label:`Proyecto (${p.type})`,ev:line(p.name)});

  const seen=new Set(); return props.filter(p=>{ const k=[p.t,p.f,p.v.toLowerCase(),p.exec||""].join("|"); if(seen.has(k)) return false; seen.add(k); return true; }); }
function applyProposals(rv, cid, sel, conf){ const c=getC(cid); const og="documento"; const sid=addSource(c,{title:"Documento: "+rv.filename,type:"documento"}); const ev="Tomado del documento «"+rv.filename+"»"; const ids={}; let n=0;
  for(const p of sel.filter(p=>p.t==="exec"&&p.f==="full_name")){ const [e]=upsertExec(c,p.v,p.pos,conf,sid,og,p.ev||ev); ids[p.v]=e.id; n++; }
  for(const p of sel){ if(p.t==="company"){ recordFact(c,"company",null,p.f,p.v,conf,sid,og,p.ev||ev); if(p.f==="city"&&CITY_DEPT[p.v]) recordFact(c,"company",null,"department",CITY_DEPT[p.v],conf,sid,og,"Derivado de la ciudad"); n++; }
    else if(p.t==="exec"&&p.f!=="full_name"){ let eid=ids[p.exec]; if(!eid){ const [e]=upsertExec(c,p.exec,null,conf,sid,og,ev); eid=e.id; } recordFact(c,"executive",eid,p.f,p.v,conf,sid,og,p.ev||ev); n++; }
    else if(p.t==="project"){ addProject(c,{name:p.v,type:p.ptype,conf,src:sid,description:p.ev,origin:og}); n++; } }
  reanalyze(c); save(c); return [c,n]; }
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error("No se pudo cargar el lector")); document.head.appendChild(s); }); }
async function pdfText(file){ if(!window.pdfjsLib){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"); }
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; let out=""; for(let i=1;i<=Math.min(pdf.numPages,60);i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); let last=null, ln=""; for(const it of tc.items){ const y=it.transform?Math.round(it.transform[5]):0; if(last!==null&&Math.abs(y-last)>2){ out+=ln.trim()+"\n"; ln=""; } ln+=it.str+(it.hasEOL?"\n":" "); last=y; } out+=ln.trim()+"\n"; } return out; }
async function handleFiles(files, cid){ for(const file of files){ const ext=(file.name.split(".").pop()||"").toLowerCase(); const rv={id:uid(), filename:file.name.slice(0,150), size:file.size, kind:null, status:"procesado", method:null, text:null, sheets:null, message:null, company:cid||null, uploaded_at:nowIso()};
  try{ if(file.size>25*1024*1024) throw new Error("El archivo supera 25 MB.");
    if(["xlsx","xlsm","csv"].includes(ext)){ rv.kind="tabla"; rv.method="hoja de cálculo"; let wb; if(ext==="csv"){ const buf=new Uint8Array(await file.arrayBuffer()); let txt; try{ txt=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ txt=new TextDecoder("windows-1252").decode(buf); } wb=XLSX.read(txt.replace(/^﻿/,""),{type:"string"}); } else wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
      rv.sheets=readTable(wb.SheetNames.map(n=>[n, XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""}).slice(0,5000)])); if(!rv.sheets.length){ rv.status="sin datos"; rv.message="No se encontró una fila de encabezados reconocible (p. ej. «Empresa», «Correo», «Teléfono»)."; } }
    else if(ext==="xls") throw new Error("Formato .xls antiguo: ábralo en Excel y guárdelo como .xlsx.");
    else if(ext==="pdf"){ rv.kind="pdf"; rv.text=await pdfText(file); rv.method="texto del PDF"; if(rv.text.trim().length<40){ if(S.sample&&S.sampleImages){ rv.status="requiere OCR"; rv.message="PDF escaneado (sin texto). Tome una foto o captura de cada página y súbala como imagen para leerla con Claude."; } else { rv.status="requiere OCR"; rv.message="PDF escaneado (sin texto). Registre los datos manualmente."; } } }
    else if(["jpg","jpeg","png","webp","gif"].includes(ext)){ rv.kind="imagen"; if(!(S.sample&&S.sampleImages)){ rv.status="requiere OCR"; rv.message="La lectura de fotos con Claude no está disponible en esta vista."; }
      else { toast("Claude está leyendo la imagen…"); const r=await S.sample("Transcribe literalmente todo el texto visible en esta imagen, respetando los saltos de línea. No resumas, no corrijas, no completes datos ilegibles (escribe [ilegible]) y no agregues nada que no esté escrito. Responde sólo con la transcripción.",{images:[file],modelTier:"default"}); rv.text=r.text; rv.method="lectura de imagen (Claude)"; } }
    else if(ext==="txt"){ rv.kind="texto"; rv.text=await file.text(); rv.method="texto"; }
    else throw new Error("Formato no admitido. Use Excel (.xlsx), CSV, PDF, foto (JPG/PNG) o texto (.txt).");
    if(rv.text!=null&&rv.status==="procesado"&&!rv.text.trim()){ rv.status="sin datos"; rv.message="El documento no contiene texto legible."; } }
  catch(e){ rv.status="error"; rv.message=e&&e.code?("No se pudo leer: "+e.code):(e.message||String(e)); }
  await persistDoc(rv); S.review=rv; } go("documentos"); }
async function persistDoc(rv){ const body={filename:rv.filename,size:rv.size,kind:rv.kind,status:rv.status,method:rv.method,message:rv.message,company:rv.company,uploaded_at:rv.uploaded_at,applied:rv.applied||null,text:rv.text?rv.text.slice(0,60000):null};

function editForm(c, ent, eid, field, cur){ const id=`e-${ent}-${eid||"c"}-${field}`; const input=field==="sector"?`<select id="${id}-v" name="value"><option value="">— vaciar —</option>${SECTORS.map(s=>`<option ${cur===s?"selected":""}>${s}</option>`).join("")}</select>`:field==="department"?`<select id="${id}-v" name="value"><option value="">— vaciar —</option>${DEPTS.map(s=>`<option ${cur===s?"selected":""}>${s}</option>`).join("")}</select>`:`<input id="${id}-v" name="value" value="${esc(cur||"")}" style="min-width:220px">`;
  return `<details class="ed"><summary>✎ editar</summary><form data-form="field" data-ent="${ent}" data-eid="${eid||""}" data-field="${field}"><div class="inl">${input}<select id="${id}-c" name="conf"><option value="verificado">Verificado</option><option value="probable">Probable</option></select></div><div class="inl"><input id="${id}-s" name="source_url" placeholder="URL de la fuente (opcional)"><input id="${id}-n" name="note" placeholder="Cómo se confirmó"><button class="btn sm pr">Guardar</button></div><div class="sm mut">El valor anterior se conserva en el historial.</div></form></details>`; }
function altHtml(c, ent, eid, field){ return alternatives(c,ent,eid,field).map(f=>`<div class="alt">Otro valor encontrado: <b>${esc(f.v)}</b> ${conf(f.conf)} · ${srcHtml(c,f.src)} · ${fdate(f.at)} <button class="btn ln sm" data-act="adopt" data-idx="${f.idx}">adoptar</button></div>`).join(""); }
function fieldRows(c, t, ent, eid, labels){ return Object.entries(labels).map(([f,l])=>{ const st=t.fields?.[f]; const v=t[f]; const val=(f==="website"||f==="linkedin_url")?ext(v):pv(v);
  return `<tr><td>${l}</td><td>${val}${altHtml(c,ent,eid,f)}${editForm(c,ent,eid,f,v)}</td><td>${conf(st?.conf)}${st?.origin==="manual"?`<div class="sm mut">manual</div>`:""}</td><td class="sm">${st?srcHtml(c,st.src):"—"}</td><td class="sm">${st?fdate(st.at):"—"}</td></tr>`; }).join(""); }
function vFicha(id){ const c=S.companies.get(id); if(!c) return pageTop("empresa","Empresa no encontrada","Puede haber sido eliminada.",`<a class="btn" href="#empresas">Volver</a>`,false); const a=c.analysis||analyze(c); const m=missing(c); const T=S.tab;

  if(T==="noticias") body=`<div class="card tw"><table><tr><th>Fecha</th><th>Titular</th><th>Medio</th><th>Categorías</th></tr>${c.news.map(n=>`<tr><td class="sm">${fdate(n.date)}</td><td><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>${n.summary&&n.summary!==n.title?`<div class="sm mut">${esc(n.summary.slice(0,160))}</div>`:""}</td><td>${esc(n.publisher||"—")}</td><td class="sm">${esc((n.cats||[]).join(", ")||"—")}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Sin noticias registradas.</td></tr>`}</table></div>`;
  if(T==="contacto") body=`<form class="card" data-form="outreach"><h2>Generar contacto</h2><p class="sm mut">Borradores basados en hechos con fuente. <b>Nada se envía automáticamente</b>: revise, edite y apruebe; envíe desde su correo o LinkedIn y márquelo como enviado.</p><div class="inl"><label class="sm">Destinatario <select id="o-exec" name="exec"><option value="">${c.execs.length?"Ejecutivo principal":"Equipo directivo (sin ejecutivo identificado)"}</option>${c.execs.map(e=>`<option value="${e.id}">${esc(e.full_name)}${e.position?" — "+esc(e.position):""}</option>`).join("")}</select></label>${S.sample?`<label class="sm"><input type="checkbox" id="o-claude" name="claude"> Redactar con Claude (sólo con los hechos registrados)</label>`:""}<button class="btn ac">GENERAR CONTACTO</button></div></form>`+
    c.drafts.filter(d=>d.status!=="descartado").map(d=>`<div class="dr"><div class="top" style="margin:0"><div><b>${CHANNELS[d.channel]}</b> <span class="bd ${d.status==="aprobado"?"b-v":d.status==="enviado manualmente"?"b-s":"b-m"}">${esc(d.status)}</span> <span class="sm mut">· ${fdate(d.at,1)} · ${esc(d.generator)}</span></div><div class="acts"><button class="btn sm" data-act="copy" data-did="${d.id}">Copiar</button>${d.status==="borrador"?`<button class="btn sm pr" data-act="draft" data-did="${d.id}" data-st="aprobado">Aprobar</button>`:d.status==="aprobado"&&d.channel!=="pitch"?`<button class="btn sm pr" data-act="draft" data-did="${d.id}" data-st="enviado manualmente">Marcar como enviado</button>`:""}<button class="btn sm" data-act="draft" data-did="${d.id}" data-st="descartado">Descartar</button></div></div>${d.subject?`<div class="sm"><b>Asunto:</b> ${esc(d.subject)}</div>`:""}<pre id="dr-${d.id}">${esc(d.body)}</pre>${d.recipient&&d.channel!=="linkedin"&&d.channel!=="pitch"?`<div class="sm mut">Destinatario sugerido: <b>${esc(d.recipient)}</b> (copie la dirección en su correo)</div>`:""}${d.warnings&&d.warnings.length?`<div class="sm" style="color:var(--warn)">⚠ ${esc(d.warnings.join(" "))}</div>`:""}${d.status==="borrador"?`<details class="ed"><summary>✎ editar texto</summary><form data-form="draftedit" data-did="${d.id}">${d.subject!=null?`<input id="de-s-${d.id}" name="subject" value="${esc(d.subject)}" style="width:100%;margin-bottom:6px">`:""}<textarea id="de-b-${d.id}" name="body" rows="10">${esc(d.body)}</textarea><button class="btn sm pr">Guardar cambios</button></form></details>`:""}</div>`).join("");
  if(T==="seguimiento") body=`<div class="grid g2"><div class="card"><h2>Estado comercial</h2><form data-form="status" class="inl"><select id="s-st" name="status">${CRM.map(s=>`<option ${c.crm_status===s?"selected":""}>${s}</option>`).join("")}</select><input id="s-note" name="note" placeholder="Comentario (opcional)"><button class="btn pr">Actualizar</button></form><p class="sm mut">Próximo seguimiento: <b>${fdate(c.next_follow_up)}</b></p><h3 style="margin-top:14px">Registrar actividad</h3><form data-form="activity"><div class="fg"><label>Tipo<select id="a-kind" name="kind">${KINDS.map(k=>`<option>${k}</option>`).join("")}</select></label><label>Fecha<input id="a-date" type="date" name="date" value="${today()}"></label><label>Reunión (fecha y hora)<input id="a-meet" type="datetime-local" name="meeting"></label><label>Fecha de seguimiento<input id="a-follow" type="date" name="follow"></label><label class="full">Comentario<textarea id="a-content" name="content" rows="3"></textarea></label></div><div class="acts" style="margin-top:10px"><button class="btn pr">Guardar actividad</button></div></form></div>
    <div class="card"><h2>Historial comercial</h2>${c.activities.length?`<ul class="tl">${c.activities.map(x=>`<li class="${x.done?"done":""}"><b>${esc(x.kind)}</b> <span class="sm mut">${fdate(x.date)}</span>${x.content?`<div>${esc(x.content)}</div>`:""}${x.meeting?`<div class="sm">Reunión: ${esc(x.meeting.replace("T"," "))}</div>`:""}${x.follow?`<div class="sm">Seguimiento: <span class="bd ${x.done?"b-m":x.follow<today()?"b-n":"b-s"}">${fdate(x.follow)}</span> <button class="btn ln sm" data-act="done" data-aid="${x.id}">${x.done?"reabrir":"marcar hecho"}</button></div>`:""}</li>`).join("")}</ul>`:`<p class="empty">Sin actividad registrada.</p>`}</div></div>`;
  if(T==="fuentes") body=`<div class="card tw"><table><tr><th>Fuente</th><th>Tipo</th><th>Primera consulta</th><th>Última consulta</th></tr>${Object.values(c.sources).sort((a,b)=>b.last.localeCompare(a.last)).map(s=>`<tr><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url.slice(0,80))}</a><div class="sm mut">${esc(s.url.slice(0,90))}</div>`:esc(s.title||"")}</td><td>${esc(s.type)}</td><td class="sm">${fdate(s.first,1)}</td><td class="sm">${fdate(s.last,1)}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Sin fuentes.</td></tr>`}</table></div>`;

function vInvestigacion(){ const runs=S.meta.runs||[]; return pageTop("investigación","investigación automática","Busca empresas bolivianas y proyectos en fuentes públicas con su conector Firecrawl. Lo que no se encuentra queda como «Pendiente»; los duplicados se detectan por nombre normalizado y dominio web.")+
  (S.mcp?"":`<div class="msg wa">La investigación web usa el conector <b>Firecrawl</b> de claude.ai. ${esc(S.mcpNote||"No está disponible en esta vista.")}</div>`)+
  `<div class="grid g2"><form class="card tri" data-form="discover"><h2>Buscar nuevas empresas</h2><div class="fg"><div class="full"><div class="sm mut">Ciudades</div><div class="chk">${["Santa Cruz","La Paz","Cochabamba","Sucre","Tarija","Oruro","Potosí","El Alto","Trinidad"].map(c=>`<label><input type="checkbox" name="cities" value="${c}" ${PRIO.includes(c)?"checked":""}> ${c}</label>`).join("")}</div></div><div class="full"><div class="sm mut">Sectores</div><div class="chk">${SECTORS.map(s=>`<label><input type="checkbox" name="sectors" value="${s}" checked> ${s}</label>`).join("")}</div></div><label class="full">Búsqueda adicional (opcional)<input id="d-extra" name="extra" placeholder="p. ej. licitación hospital Santa Cruz 2026, condominio Urubó"></label><label>Investigar en profundidad las nuevas (máximo)<input id="d-max" type="number" name="max" value="3" min="0" max="20"></label></div><p class="sm mut">Costo estimado: una consulta de Firecrawl por ciudad y sector, más 6–9 por cada empresa investigada a fondo.</p><div class="acts"><button class="btn pr" ${S.mcp?"":"disabled"}>Iniciar búsqueda</button></div></form>
  <div class="card"><h2>Cómo se investiga</h2><ol class="sm"><li><b>Búsqueda web y de noticias</b> (Firecrawl): sitios propios de empresas del sector y notas sobre edificios, condominios, urbanizaciones, inversiones, licitaciones y conflictos.</li><li><b>Sitio oficial</b>: inicio, contacto, nosotros y proyectos. Correos, teléfonos y LinkedIn sólo si están publicados.</li><li><b>Ejecutivos</b>: sólo cuando una fuente vincula explícitamente nombre, cargo y empresa.</li><li><b>Claude como lector</b> ${S.sample&&S.meta.useClaude!==false?`<span class="bd b-v">activo</span>`:`<span class="bd b-m">inactivo</span>`}: cada dato debe traer una cita textual que exista en la página leída; si no aparece, se descarta.</li></ol><p class="sm mut">Nunca se deducen correos por formato (nombre.apellido@…), ni nombres ni teléfonos.</p></div></div>

function vDocumentos(){ const rv=S.review; const docs=[...S.docs.values()].sort((a,b)=>(b.uploaded_at||"").localeCompare(a.uploaded_at||"")); const cos=active().sort((a,b)=>a.name.localeCompare(b.name));

function route(){ const h=(location.hash||"#panel").slice(1); const m=/^empresa-([a-z0-9]+)$/.exec(h); if(m){ if(S.view!=="empresa-"+m[1]) S.tab="datos"; S.view="empresa-"+m[1]; } else S.view=["panel","empresas","nueva","investigacion","documentos","seguimiento","cambios","ajustes"].includes(h)?h:"panel"; render(); window.scrollTo(0,0); }

  const v=S.view; const html=v==="panel"?vPanel():v==="empresas"?vEmpresas():v==="nueva"?vNueva():v==="investigacion"?vInvestigacion():v==="documentos"?vDocumentos():v==="seguimiento"?vSeguimiento():v==="cambios"?vCambios():v==="ajustes"?vAjustes():vFicha(v.slice(8));

  if(kind==="filters"){ S.filters={q:g("q"),city:g("city"),dept:g("dept"),sector:g("sector"),pot:g("pot"),status:g("status"),sort:g("sort"),inc:!!fd.get("inc"),archived:!!fd.get("archived")}; render(); return; }
  if(kind==="newco"){ const name=g("name"); const dup=findDup(name,g("website")); if(dup){ flash("wa",`La empresa ya está registrada como «${dup.name}». No se creó un duplicado.`); go("empresa-"+dup.id); return; }
    const c=newCompany(name); const cf=g("conf")===V?V:P; const sid=addSource(c,g("source_url")?{url:g("source_url"),title:g("note")||null,type:"manual"}:{title:"Ingreso manual"+(g("note")?": "+g("note"):""),type:"manual"}); recordFact(c,"company",null,"name",name,cf,sid,"manual");
    for(const k of ["activity","sector","city","website","email","phone","linkedin_url"]){ let v=g(k); if(!v) continue; if(k==="phone") v=normPhone(v)||v; if(k==="website") v="https://"+(domainOf(v)||v); recordFact(c,"company",null,k,v,cf,sid,"manual"); }
    if(c.city&&CITY_DEPT[c.city]) recordFact(c,"company",null,"department",CITY_DEPT[c.city],cf,sid,"manual","Derivado de la ciudad"); reanalyze(c); await save(c); S.tab="datos"; go("empresa-"+c.id); if(fd.get("investigate")&&S.mcp) investigate(c.id,false); return; }
  if(kind==="field"&&id){ const c=getC(id); const ent=f.dataset.ent, eid=f.dataset.eid||null, field=f.dataset.field; let v=g("value"); const cf=g("conf")===V?V:P; try{ if(!v){ manualClear(c,ent,eid,field); } else { if(field==="phone") v=normPhone(v)||v; const sid=addSource(c,g("source_url")?{url:g("source_url"),title:g("note")||null,type:"manual"}:{title:"Ingreso manual"+(g("note")?": "+g("note"):""),type:"manual"}); recordFact(c,ent,eid,field,v,cf,sid,"manual",g("note"),null,true); if(ent==="company"&&field==="city"&&CITY_DEPT[v]) recordFact(c,"company",null,"department",CITY_DEPT[v],cf,sid,"manual","Derivado de la ciudad",null,true); } reanalyze(c); save(c); toast("Dato actualizado."); render(); }catch(err){ flash("er",err.message); } return; }
  if(kind==="exec"&&id){ const c=getC(id); const cf=g("conf")===V?V:P; const sid=addSource(c,g("source_url")?{url:g("source_url"),title:g("note")||null,type:"manual"}:{title:"Ingreso manual"+(g("note")?": "+g("note"):""),type:"manual"}); const [ex]=upsertExec(c,g("full_name"),g("position")||null,cf,sid,"manual",g("note")); for(const k of ["email","phone","linkedin_url"]){ let v=g(k); if(k==="phone"&&v) v=normPhone(v)||v; if(v) recordFact(c,"executive",ex.id,k,v,cf,sid,"manual",g("note"),null,true); } reanalyze(c); save(c); toast("Ejecutivo registrado."); render(); return; }
  if(kind==="project"&&id){ const c=getC(id); const sid=addSource(c,{url:g("source_url"),title:g("name"),type:"manual"}); addProject(c,{name:g("name"),type:g("type")||null,city:g("city")||null,status:g("status")||null,description:g("description")||null,conf:g("conf")===V?V:P,src:sid,date:g("date")||null,origin:"manual"}); reanalyze(c); save(c); toast("Proyecto registrado."); render(); return; }
  if(kind==="status"&&id){ const c=getC(id); setStatus(c,g("status"),g("note")); save(c); toast("Estado actualizado."); render(); return; }
  if(kind==="activity"&&id){ const c=getC(id); addActivity(c,{kind:g("kind"),content:g("content")||null,date:g("date")||today(),meeting:g("meeting")||null,follow:g("follow")||null}); save(c); toast("Actividad registrada."); render(); return; }
  if(kind==="draftedit"&&id){ const c=getC(id); const d=c.drafts.find(x=>x.id===f.dataset.did); d.body=fd.get("body"); if(fd.has("subject")) d.subject=fd.get("subject"); save(c); toast("Borrador actualizado."); render(); return; }
  if(kind==="outreach"&&id){ const c=getC(id); let b; try{ b=basis(reanalyze(c), g("exec")||null); }catch(err){ flash("er",err.message); return; } const s=sender(); let texts=null, gen="plantilla basada en hechos";
    if(fd.get("claude")&&S.sample){ const btn=f.querySelector("button"); btn.disabled=true; btn.textContent="Claude está redactando…";
      try{ const {warnings,...facts}=b; const d=await S.sample.json(`Redacta, en español de Bolivia, material de primer contacto de Serrate Paz & Asociados (estudio jurídico) dirigido a la empresa descrita. Tono profesional, ejecutivo, directo y sobrio; sin lenguaje publicitario ni promesas. Usa SOLO los hechos provistos; no agregues datos, cifras ni nombres. Si no hay ejecutivo, dirígete al equipo directivo. Menciona al menos un hecho concreto con su fecha si la tiene. No menciones denuncias, conflictos ni litigios (conflict_news) en email, linkedin ni meeting; sólo en pitch.\nHECHOS: ${JSON.stringify({...facts,remitente:s})}\nResponde sólo JSON: {"email_subject":"...","email_body":"... (máx. 180 palabras)","linkedin":"... (máx. 280 caracteres)","meeting":"... (propuesta de reunión de 30 minutos, máx. 120 palabras)","pitch":"... (argumento interno, 3-5 viñetas)"}`,{modelTier:"default"});
        if(d&&d.email_body) { texts={email:[d.email_subject||"",d.email_body],linkedin:[null,String(d.linkedin||"").slice(0,300)],meeting:[`Propuesta de reunión — ${c.name}`,d.meeting||""],pitch:[`Argumento comercial — ${c.name}`,d.pitch||""]}; gen="Claude (sobre hechos registrados)"; } }
      catch(err){ flash("wa","Claude no pudo redactar ("+(err&&err.code||"error")+"); se usó la plantilla basada en hechos."); } }
    texts=texts||templates(b,s); const fresh=Object.entries(texts).filter(([ch,[subject,body]])=>body).map(([ch,[subject,body]])=>({id:uid(),channel:ch,subject,body,status:"borrador",generator:gen,recipient:b.recipient,warnings:b.warnings,exec:b.executive&&b.executive.id,at:nowIso()})); c.drafts=fresh.concat(c.drafts);
    c.drafts=c.drafts.slice(0,40); await save(c); flash("ok","Se generaron 4 borradores. Revíselos: nada se envía sin su aprobación."); for(const w of b.warnings) S.flash.push({kind:"wa",text:w}); render(); return; }
  if(kind==="discover"){ const cities=fd.getAll("cities"); const sectors=fd.getAll("sectors"); if(!cities.length||!sectors.length){ flash("er","Elija al menos una ciudad y un sector."); return; } discover(cities,sectors,g("extra")||null,Math.max(0,Math.min(20,+g("max")||0))); return; }
  if(kind==="settings"){ S.meta.sender={name:g("name"),position:g("position"),email:g("email"),phone:g("phone")}; S.meta.useClaude=!!fd.get("useClaude"); saveMeta(); toast("Ajustes guardados."); render(); return; } });

/* ============================================================ arranque */
async function boot(){ route(); if(!window.claude||!window.claude.use){ S.loaded=true; render(); return; }
  const [db,mcp,sample,downloads,user]=await Promise.all(["db","mcp","sample","downloads","user"].map(n=>window.claude.use(n).catch(()=>null)));
  S.db=db; S.sample=sample; S.downloads=downloads; S.uid=user?await user.id().catch(()=>null):null;
  if(sample){ const lim=await sample.limits().catch(()=>null); S.sampleImages=!!(lim&&lim.images); }
  if(mcp){ try{ const lt=await mcp.listTools(FC); const sv=(lt.servers||[]).find(x=>x.server===FC); if(sv&&(sv.tools||[]).some(t=>t.name==="firecrawl_search")){ S.mcp=mcp; if(sv.authStatus==="needs_reauth") S.mcpNote="La conexión venció: vuelva a conectarlo en claude.ai → Configuración → Conectores."; } else S.mcpNote="Agregue Firecrawl en claude.ai → Configuración → Conectores para activar la investigación web."; }catch(e){ S.mcpNote=mcpMsg(e); } } else S.mcpNote="Los conectores no están disponibles en esta vista.";
  if(!db){ S.loaded=true; render(); return; }
  const timer=setTimeout(()=>{ if(!S.loaded){ S.offline=true; render(); } },10000);
  db.collection("companies").onSnapshot(snap=>{ S.companies=new Map(snap.docs.map(d=>[d.id,{...clone(d.data()),id:d.id}])); for(const c of S.companies.values()){ c.fields=c.fields||{}; c.facts=c.facts||[]; c.changes=c.changes||[]; c.sources=c.sources||{}; c.execs=c.execs||[]; c.projects=c.projects||[]; c.news=c.news||[]; c.activities=c.activities||[]; c.drafts=c.drafts||[]; }
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.offline=false; } S.loaded=true; const ae=document.activeElement; if(S.job||(ae&&$("#app").contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))) S.pending=true; else render(); }, err=>{ clearTimeout(timer); S.loaded=true; flash("er","No se pudo leer la base de datos ("+err.code+")."); render(); });
  db.collection("documents").onSnapshot(snap=>{ S.docs=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}])); if(S.view==="documentos"&&!S.job) { const ae=document.activeElement; if(!(ae&&$("#app").contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); } }, ()=>{});
  db.doc("meta/app").onSnapshot(s=>{ S.meta=s.exists?clone(s.data()):{}; }, ()=>{});
  document.addEventListener("focusout", ()=>setTimeout(()=>{ if(S.pending&&!S.job){ const ae=document.activeElement; if(!(ae&&$("#app").contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); } },150)); }
boot();
</script>
